<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoCo Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Light is the default; dark is opt-in and only if the user has chosen it before.
      // The OS preference is deliberately NOT consulted. Applied before first paint so a
      // dark-mode user doesn't get a white flash. Kept in sync with context/ThemeContext.tsx.
      ;(function () {
        try {
          var dark = localStorage.getItem('coco-flow-theme') === 'dark'
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode — stay light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
